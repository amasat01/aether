# SPDX-License-Identifier: Apache-2.0
#
# Seal, build, check and test everything that ships, on the pull request.
# The artifacts are named by git tree hash, so publish.yml and docs.yml can
# find and upload exactly what was tested here instead of rebuilding it.
#
# aether-dsc is one distribution with two packages: `aether_dsc` (the sealed payload) and `aether`
# (CPU/GPU arrays, a compiled nanobind module plus, on linux x86_64, the CUDA plugin). One sdist and
# 30 wheels (the platforms and Pythons hawk ships). The payload is NOT source: `python -m aether_dsc.seal` must run
# before the build, sealing THIS checkout's aether headers (manifest
# `aether_dsc/payload_headers.txt`) plus the sibling eagle checkout's
# `plugin/gref_layout.h` / `plugin/gref_abi.h` into a digest-named blob
# under `aether_dsc/_payload/` (gitignored dev-time output; a wheel built
# without sealing first ships with no payload and fails at import). Sealing
# also runs the NVRTC-clean gate over every device-reachable header, so the
# job needs `cuda-bindings` + `nvidia-cuda-nvrtc-cu12` + `nvidia-cuda-cccl-cu12`
# from PyPI (a GitHub runner has no CUDA toolkit, so the CCCL `cuda/std`
# headers the gate compiles against come from the pip wheel too). NVRTC only
# compiles (to PTX), so this needs no GPU and no driver.

name: Release

# Pull requests only: main receives the tested tree, nothing re-runs there.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The sealed payload is the same for every wheel: sealed once here (NVRTC-clean gate included), handed to
  # the wheel builds as an artifact.
  seal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: aether
          fetch-depth: 0

      # The sibling eagle checkout `seal()` reads plugin/gref_layout.h and
      # plugin/gref_abi.h from (host path only; NVRTC itself is served an
      # alias). Pinned ref, else a same-named branch, else main.
      - uses: ./aether/.github/actions/companion
        with:
          repo: eagle
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: aether/.github/companions

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aether/dsc/pyproject.toml

      - run: python -m pip install --quiet "cuda-bindings" "nvidia-cuda-nvrtc-cu12" "nvidia-cuda-cccl-cu12" pyyaml

      - name: Seal this checkout's AETHER payload (NVRTC-clean gate included)
        run: cd aether/dsc && python -m aether_dsc.seal --layout-header "$GITHUB_WORKSPACE/eagle/plugin/gref_layout.h"

      - uses: actions/upload-artifact@v7
        with:
          name: payload
          retention-days: 7
          path: aether/dsc/aether_dsc/_payload/

  # One leg per platform. Every leg builds `aether._core` (plain C++, no CUDA); the x86_64 and aarch64 legs also build the
  # one CUDA plugin (compiled by nvcc 12.9 with -cudart none: it needs the driver and no CUDA runtime, and serves CUDA 12 and 13).
  wheels:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            plat: manylinux_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            plat: manylinux_aarch64
          - arch: macos-arm64
            runner: macos-15
            plat: macosx_arm64
    name: wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      # The same CIBW_BUILD lines as hawk's release.yml: every platform and Python hawk has a wheel for has an
      # aether-dsc wheel. A hawk matrix change lands here first.
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
      CIBW_BEFORE_BUILD: >-
        python -m pip install 'scikit-build-core>=0.10' 'setuptools-scm>=8' 'ninja>=1.5'
        'nanobind>=3.1,<4; python_version >= "3.10"'
        'nanobind>=2.2,<3; python_version < "3.10"'
      # The headers sit one directory above the package, outside cibuildwheel's copy: bind-mount the checkout.
      CIBW_CONTAINER_ENGINE: "docker; create_args: --volume ${{ github.workspace }}/aether:/sib/aether:ro --volume ${{ github.workspace }}/.ccache-cibw:/ccache --volume ${{ github.workspace }}/.cuda-redist:/cuda-redist"
      CIBW_ENVIRONMENT_LINUX: "AETHER_HEADER_ROOT=/sib/aether AETHER_CUDA_ROOT=/usr/local/cuda-12.9 CMAKE_BUILD_PARALLEL_LEVEL=2 CCACHE_DIR=/ccache CCACHE_MAXSIZE=500M CCACHE_COMPILERCHECK=content CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache"
      # The host FFT runs on OpenMP and includes <omp.h>, which Apple's clang lacks: Homebrew's libomp, which delocate
      # copies into the wheel (Linux: auditwheel bundles libgomp). Its deployment target is the runner's macOS, so the
      # wheels declare that too.
      CIBW_BEFORE_ALL_MACOS: "brew list libomp >/dev/null 2>&1 || brew install libomp"
      # The wheel ships the OpenMP runtime itself, once, at aether/_omp/ (dsc/CMakeLists.txt); repair must not vendor another.
      CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v --exclude libomp.dylib {wheel}"
      CIBW_ENVIRONMENT_MACOS: "AETHER_HEADER_ROOT=${{ github.workspace }}/aether MACOSX_DEPLOYMENT_TARGET=15.0 OpenMP_ROOT=/opt/homebrew/opt/libomp CMAKE_PREFIX_PATH=/opt/homebrew/opt/libomp CCACHE_DIR=${{ github.workspace }}/.ccache-cibw CCACHE_MAXSIZE=500M CCACHE_COMPILERCHECK=content CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache"
      # nvcc 12.9 + the runtime headers for the plugin (compiled with -cudart none: no CUDA runtime library is linked or shipped), x86_64 and aarch64 (NVIDIA's `sbsa`),
      # from NVIDIA's versioned redist archives, pinned with their sha256 sums in .github/cuda_redist.sh (the one place; the download cache is keyed by them)
      # ccache from EPEL (AlmaLinux 8); EPEL mirrors fail often on aarch64: retry, then run uncached through a pass-through ccache stand-in
      CIBW_BEFORE_ALL_LINUX: >-
        git config --global --add safe.directory '*';
        for i in 1 2 3; do dnf install -y epel-release && dnf install -y ccache && break; dnf clean all; done;
        command -v ccache >/dev/null || { printf '%s\n' '#!/bin/sh' 'case $1 in -*) exit 0;; esac' 'exec "$@"' > /usr/local/bin/ccache;
        chmod +x /usr/local/bin/ccache; };
        CCACHE_DIR=/ccache ccache -z;
        case "$(uname -m)" in x86_64|aarch64) sh /sib/aether/.github/cuda_redist.sh fetch "$(uname -m)" /usr/local/cuda-12.9 /cuda-redist;; esac
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: "ccache -s; auditwheel repair --exclude libgomp.so.1 -w {dest_dir} {wheel}"
      CIBW_TEST_SKIP: "*"
    steps:
      - uses: actions/checkout@v7
        with:
          path: aether
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: payload
          path: aether/dsc/aether_dsc/_payload

      # package-dir is aether/dsc, below the git root: the version is computed here and handed in
      - name: The version this checkout's label gives
        working-directory: aether
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          v=$(python tools/next_version.py "$PR_LABELS" 2>/dev/null || true)
          [ -n "$v" ] || v="0.0.0.dev0+g$(git rev-parse --short HEAD)"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$v" >> "$GITHUB_ENV"
          echo "CIBW_ENVIRONMENT_PASS_LINUX=SETUPTOOLS_SCM_PRETEND_VERSION" >> "$GITHUB_ENV"

      # The finished wheels are remembered under a digest of everything that goes into them: this tree, the sealed payload
      # (which carries the eagle headers), the version, this workflow (cibuildwheel and CUDA pins) and the platform. A hit
      # skips the build; the checks downstream run on what is restored.
      - id: wk
        env:
          PLAT: ${{ matrix.plat }}
        run: |
          args=(--tree aether --skip docs/ --skip .github/ --file aether/.github/workflows/release.yml --file aether/.github/cuda_redist.sh --str "$PLAT $RUNNER_OS $RUNNER_ARCH $SETUPTOOLS_SCM_PRETEND_VERSION")
          while read -r f; do args+=(--file "$f"); done < <(find aether/dsc/aether_dsc/_payload -type f | sort)
          if [ "$RUNNER_OS" = Linux ]; then
            args+=(--str "manylinux_2_28 $(docker buildx imagetools inspect "quay.io/pypa/manylinux_2_28_$(uname -m)" --format '{{.Manifest.Digest}}' 2>/dev/null || true)")
          fi
          digest=$(aether/.github/ci_digest.sh "${args[@]}") || exit 1
          [ -n "$digest" ] || { echo "::error::empty digest"; exit 1; }
          echo "key=wheels-v2-$PLAT-$digest" >> "$GITHUB_OUTPUT"
      - id: wh
        uses: actions/cache@v6
        with:
          path: dist
          key: ${{ steps.wk.outputs.key }}
      - if: steps.wh.outputs.cache-hit == 'true'
        run: ls -l dist

      # ccache inside the manylinux container (the runner directory is bind-mounted at /ccache); on macOS the build reads it in place
      - if: steps.wh.outputs.cache-hit != 'true'
        run: mkdir -p .ccache-cibw
      - if: steps.wh.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install ccache
      # The CUDA redist archives (x86_64 and aarch64 legs), kept under the pinned versions and sha256 sums; each is verified on use
      - if: steps.wh.outputs.cache-hit != 'true'
        run: mkdir -p .cuda-redist
      - id: cr
        if: steps.wh.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: echo "key=cuda-redist-$(aether/.github/cuda_redist.sh key "$(uname -m)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: steps.wh.outputs.cache-hit != 'true' && runner.os == 'Linux'
        with:
          path: .cuda-redist
          key: ${{ steps.cr.outputs.key }}
      - uses: actions/cache@v6
        if: steps.wh.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache-cibw
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-cibw-aether-${{ hashFiles('aether/**/*.h', 'aether/**/*.hpp', 'aether/**/*.cpp', 'aether/**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-cibw-aether-

      - name: Build wheels (cibuildwheel 3.x; CPython 3.9-3.14 plus free-threaded 3.13t/3.14t)
        if: steps.wh.outputs.cache-hit != 'true'
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: aether/dsc
          output-dir: dist
        env:
          CIBW_ENABLE: cpython-freethreading
          CIBW_BUILD: "cp39-${{ matrix.plat }} cp310-${{ matrix.plat }} cp311-${{ matrix.plat }} cp312-${{ matrix.plat }} cp313-${{ matrix.plat }} cp314-${{ matrix.plat }} cp313t-${{ matrix.plat }} cp314t-${{ matrix.plat }}"
      - name: Build the CPython 3.15 and 3.15t wheels (cibuildwheel 4.x)
        if: steps.wh.outputs.cache-hit != 'true'
        uses: pypa/cibuildwheel@v4.3.3
        with:
          package-dir: aether/dsc
          output-dir: dist
        env:
          CIBW_ENABLE: ""
          CIBW_BUILD: "cp315-${{ matrix.plat }} cp315t-${{ matrix.plat }}"
      # on Linux the stats are printed inside the container, before each repair
      - if: always() && steps.wh.outputs.cache-hit != 'true' && runner.os == 'macOS'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache-cibw
        run: ccache -s

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.arch }}
          retention-days: 7
          path: dist/

  # Assembles the wheels and the sdist into the one artifact the rest of the workflow and publish.yml use.
  build:
    needs: [seal, wheels]
    runs-on: ubuntu-24.04
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: aether
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aether/dsc/pyproject.toml

      - name: Tag this checkout with the version its label gives
        working-directory: aether
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          v=$(python tools/next_version.py "$PR_LABELS" 2>/dev/null || true)  # no label or release:none: build untagged (the gate reports a missing label)
          # untagged, the sdist takes the wheels' version: a higher one would win `--find-links dist` over every wheel
          [ -n "$v" ] && git tag "v$v" || echo "SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0.dev0+g$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - run: python -m pip install --quiet build "scikit-build-core>=0.10" "setuptools-scm>=8" "twine>=6" pyyaml

      - name: publish and deploy workflows only download, verify and upload
        run: python aether/tools/ci_publish_subset.py

      - uses: actions/download-artifact@v8
        with:
          name: payload
          path: aether/dsc/aether_dsc/_payload

      # the sealed blob ships inside the sdist; the sdist hook copies the header closure `_core` needs
      - name: Build the sdist
        run: cd aether/dsc && python -m build --sdist --outdir ../../dist

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Ten wheels per platform (3.9-3.15 plus 3.13t, 3.14t, 3.15t), none unrepaired
        run: |
          for plat in manylinux*_x86_64 manylinux*_aarch64 macosx_*_arm64; do
            n=$(find dist -name "*-${plat}.whl" | wc -l)
            [ "$n" -eq 10 ] || { echo "::error::$n wheels for $plat, expected 10"; exit 1; }
          done
          [ "$(find dist -name '*.whl' | wc -l)" -eq 30 ] || { echo "::error::unexpected wheel in dist"; ls dist; exit 1; }
          [ "$(ls dist/*.whl dist/*.tar.gz | sed "s/\.tar\.gz$//" | cut -d- -f2 | sort -u | wc -l)" -eq 1 ] || { echo "::error::the sdist and wheels carry different versions"; ls dist; exit 1; }
          echo "OK: 10 wheels each for x86_64, aarch64 and macOS arm64"

      - name: Same CIBW_BUILD lines as hawk's release workflow
        run: |
          # the companion check lives in the hawk repo's own CI; here the lines must stay what the header says
          grep -c 'CIBW_BUILD: "cp39-' aether/.github/workflows/release.yml

      - name: Wheel contents - zero Requires-Dist, both plugins on x86_64 and aarch64, right ELF arch, only the seam exported
        run: |
          python - <<'PY'
          import glob, zipfile, subprocess, tempfile, os, re
          for whl in sorted(glob.glob("dist/*.whl")):
              z = zipfile.ZipFile(whl)
              names = z.namelist()
              meta = next(n for n in names if n.endswith(".dist-info/METADATA"))
              assert not [l for l in z.read(meta).decode().splitlines() if l.startswith("Requires-Dist") and "extra ==" not in l], whl
              plugins = sorted(os.path.basename(n) for n in names if re.search(r"aether/libaether_cuda\.so$", n))
              want = ["libaether_cuda.so"] if "manylinux" in whl and ("x86_64" in whl or "aarch64" in whl) else []
              assert plugins == want, (whl, plugins)
              assert not any("libcudart" in n or "libcuda." in n for n in names), whl
              # exactly ONE OpenMP runtime, at the stable path aether_dsc.openmp() reports (no Requires-Dist for it, and
              # no copy vendored by auditwheel or delocate: eagle and hawk link this one)
              omp = sorted(n for n in names if re.search(r"lib(gomp|omp|iomp)[^/]*\.(so|dylib)", n))
              want_omp = ["aether/_omp/libgomp.so.1"] if "manylinux" in whl else ["aether/_omp/libomp.dylib"] if "macosx" in whl else []
              assert omp == want_omp, (whl, omp)
              for n in omp:   # a binary, not a linker script: ELF on Linux, Mach-O on macOS
                  assert z.read(n)[:4] in (b"\x7fELF", b"\xcf\xfa\xed\xfe", b"\xca\xfe\xba\xbe"), (whl, n)
              if "macosx" in whl:   # `_core` reaches the runtime through @rpath, never an absolute (Homebrew) path
                  blob = z.read(next(n for n in names if re.fullmatch(r"aether/_core\.[^/]*\.so", n)))
                  assert blob[:4] == b"\xcf\xfa\xed\xfe", (whl, "a thin 64-bit Mach-O _core is expected")
                  refs, off = [], 32
                  for _ in range(int.from_bytes(blob[16:20], "little")):
                      cmd, size = (int.from_bytes(blob[off + k:off + k + 4], "little") for k in (0, 4))
                      if cmd in (0xC, 0x80000018, 0x8000001F):   # LOAD_DYLIB, LOAD_WEAK_DYLIB, REEXPORT_DYLIB
                          refs.append(blob[off + int.from_bytes(blob[off + 8:off + 12], "little"):off + size].split(b"\0")[0].decode())
                      off += size
                  assert [r for r in refs if re.search(r"omp[^/]*\.dylib$", r)] == ["@rpath/libomp.dylib"], (whl, refs)
              assert not any(n.startswith("aether/") and n.endswith(".py") and re.search(r"^\s*(import|from)\s+numpy\b", z.read(n).decode(), re.M) for n in names), whl
              if want and "cp312-cp312-" in whl:
                  machine = 62 if "x86_64" in whl else 183   # ELF e_machine: x86-64 / AArch64
                  with tempfile.TemporaryDirectory() as d:
                      for p in plugins:
                          blob = z.read(f"aether/{p}")
                          assert int.from_bytes(blob[18:20], "little") == machine, (whl, p)
                          open(f"{d}/{p}", "wb").write(blob)
                          # readelf, not nm: it reads any ELF, so the x86 runner can check the aarch64 plugin
                          out = subprocess.run(["readelf", "--dyn-syms", "--wide", f"{d}/{p}"], capture_output=True, text=True, check=True).stdout
                          syms = set()
                          for l in out.splitlines():
                              f = l.split()
                              # exported = defined and bindable (GLOBAL/WEAK/UNIQUE); a LOCAL entry the manylinux toolchain
                              # leaves in .dynsym is not visible to a loader
                              if len(f) >= 8 and f[0][:-1].isdigit() and f[6] != "UND" and f[3] != "SECTION" and f[4] != "LOCAL":
                                  syms.add(f[7].split("@")[0])
                          assert syms == {"aether_memory_v1"}, (p, syms)
                          # the driver API only: no CUDA runtime library needed, no CUDA symbol left undefined
                          dyn = subprocess.run(["readelf", "-d", f"{d}/{p}"], capture_output=True, text=True, check=True).stdout
                          assert "libcudart" not in dyn and "libcuda" not in dyn, (p, dyn)
                          undef = subprocess.run(["nm", "-D", "-u", f"{d}/{p}"], capture_output=True, text=True, check=True).stdout
                          assert not [l for l in undef.splitlines() if " cu" in l or "cuda" in l.lower()], (p, undef)
          print("OK")
          PY

      - run: python -m twine check --strict dist/*

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - id: tree
        run: echo "tree=$(git -C aether rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.tree.outputs.tree }}
          retention-days: 90
          path: dist/

  test-wheel:
    needs: build
    runs-on: ${{ matrix.runner }}
    name: test-wheel (${{ matrix.runner }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.13t"]
        include:   # the macOS wheel: one regular and one free-threaded build
          - runner: macos-15
            python-version: "3.13"
          - runner: macos-15
            python-version: "3.13t"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.tree }}
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fresh venv, install the wheel (no dependencies at all), pip check, tests
        run: |
          "$GITHUB_WORKSPACE/tools/wheel_check.sh" venv "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/dsc/tests" test_arrays.py test_ft_payload.py test_openmp.py
        # outside the checkout: from dsc/ the source folder dsc/aether (no _core) would shadow the installed wheel
        working-directory: ${{ runner.temp }}
      # Apple silicon kills a binary whose signature install_name_tool invalidated, and two OpenMP runtimes in one
      # process abort: check the installed macOS wheel as a real process sees it.
      - name: macOS wheel, signatures, one OpenMP runtime, host FFT tests
        if: runner.os == 'macOS'
        run: |
          . venv/bin/activate
          site=$(python -c "import aether_dsc, os; print(os.path.dirname(os.path.dirname(aether_dsc.__file__)))")
          for f in "$site"/aether/_core*.so "$site"/aether/_omp/libomp.dylib; do codesign --verify --strict "$f"; done
          refs=$(otool -L "$site"/aether/_core*.so | awk 'NR > 1 {print $1}' | grep -E 'lib(g|i)?omp[0-9]*\.dylib$' || true)
          [ "$refs" = "@rpath/libomp.dylib" ] || { echo "OpenMP references of _core: ${refs:-none}"; exit 1; }
          python - <<'PY'
          import ctypes, os, re
          import aether, aether_dsc
          from aether import fft
          fft.fft(aether.zeros((64, 4096, 2), "float64"))   # the first OpenMP region runs here
          libsystem = ctypes.CDLL(None)
          libsystem._dyld_image_count.restype = ctypes.c_uint32
          libsystem._dyld_get_image_name.restype = ctypes.c_char_p
          libsystem._dyld_get_image_name.argtypes = [ctypes.c_uint32]
          names = [libsystem._dyld_get_image_name(i).decode() for i in range(libsystem._dyld_image_count())]
          omp = [n for n in names if re.search(r"lib(g|i)?omp[0-9]*\.dylib$", n)]
          shipped = os.path.realpath(aether_dsc.openmp().library)
          assert [os.path.realpath(n) for n in omp] == [shipped], omp
          assert ctypes.CDLL(shipped).omp_get_max_threads() > 1
          print("OK", omp)
          PY
          cd "$GITHUB_WORKSPACE/dsc/tests"
          python -m pytest -q -c /dev/null --rootdir . test_fft.py -p no:cacheprovider
        working-directory: ${{ runner.temp }}

  # the sdist builds `_core` from source on a machine with a C++ compiler and no CUDA toolkit
  sdist-install:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.tree }}
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The sdist installs into a clean venv, imports, makes host arrays, refuses device ones by name
        run: |
          python -m venv sv
          sv/bin/python -m pip install --quiet dist/*.tar.gz
          sv/bin/python -m pip check
          want=$(basename dist/*.tar.gz .tar.gz); want=${want##*-}
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/sv/bin/python" - <<PY
          import aether_dsc, aether
          p = aether_dsc.payload()
          assert p.headers and p.digest
          assert aether_dsc.__version__ == "$want", aether_dsc.__version__
          assert aether.zeros(4).nbytes == 32
          try:
              aether.empty(4, device="cuda")
          except aether.CudaUnavailable:
              print("OK")
          PY

  # Notebooks are executed locally (`make -C docs nbexec`) and committed with
  # outputs; nbcheck only verifies they have them (conf.py sets
  # `nb_execution_mode = "off"`).
  docs:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: sudo apt-get update && sudo apt-get install -y doxygen

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Tag this checkout with the version its label gives
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          v=$(python tools/next_version.py "$PR_LABELS" 2>/dev/null || true)  # no label or release:none: build untagged (the gate reports a missing label)
          [ -z "$v" ] || git tag "v$v"

      # companion site (amasat01.github.io): the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./.github/actions/companion
        with:
          repo: amasat01.github.io
          path: site
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: .github/companions

      # manifesto copy, the generated capability map, notebooks checked, doxygen + sphinx -W --keep-going, every public name has a page
      - run: make gate-docs SITE_SRC=site RAPTOR_SRC=
      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ needs.build.outputs.tree }}
          retention-days: 90
          path: docs/_build/html

  # Proves the C++ in every notebook: re-runs each one on the CPU and diffs
  # the outputs, and compiles every snippet with nvcc (compile-only, no GPU).
  nbverify:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v7

      # g++-13 is the compiler ci.yml uses; the harness invokes `g++`, so
      # point that name at it.
      - run: |
          sudo apt-get update
          sudo apt-get install -y g++-13
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      # nvcc for compile-only checks of the CUDA arm: the pinned redist archives (compiler, runtime headers, CCCL; no driver, no GPU).
      - uses: ./.github/actions/cuda

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - uses: ./.github/actions/companion
        with:
          repo: amasat01.github.io
          path: site
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: .github/companions

      - run: python3 -m pip install -r docs/requirements.txt
      - run: python3 -m pip install ./site

      - run: nvcc --version && g++ --version

      # --require-cuda: a missing nvcc is a failure here, never a skip.
      - run: make -C docs nbverify NBVERIFY_ARGS=--require-cuda

  # Informational: a docs-only PR carries an already published version.
  pypi-version:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.tree }}
          path: dist
      - run: |
          whl=$(basename "$(ls dist/*.whl | head -1)")   # 30 wheels, one version
          version=$(echo "$whl" | cut -d- -f2)
          if curl -fsS "https://pypi.org/pypi/aether-dsc/${version}/json" > /dev/null; then
            echo "::notice::aether-dsc ${version} is already on PyPI; a release needs a version bump"
          else
            echo "::notice::aether-dsc ${version} is not on PyPI yet"
          fi
