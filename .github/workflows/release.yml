# SPDX-License-Identifier: Apache-2.0
#
# Seal, build, check and test everything that ships, on the pull request.
# The artifacts are named by git tree hash, so publish.yml and docs.yml can
# find and upload exactly what was tested here instead of rebuilding it.
#
# aether-dsc is one distribution with two packages: `aether_dsc` (the sealed payload) and `aether`
# (CPU/GPU arrays, a compiled nanobind module plus, on linux x86_64, two CUDA plugins). One sdist and
# 30 wheels (the platforms and Pythons hawk ships). The payload is NOT source: `python -m aether_dsc.seal` must run
# before the build, sealing THIS checkout's aether headers (manifest
# `aether_dsc/payload_headers.txt`) plus the sibling eagle checkout's
# `plugin/gref_layout.h` / `plugin/gref_abi.h` into a digest-named blob
# under `aether_dsc/_payload/` (gitignored dev-time output; a wheel built
# without sealing first ships with no payload and fails at import). Sealing
# also runs the NVRTC-clean gate over every device-reachable header, so the
# job needs `cuda-bindings` + `nvidia-cuda-nvrtc-cu12` + `nvidia-cuda-cccl-cu12`
# from PyPI (a GitHub runner has no CUDA toolkit, so the CCCL `cuda/std`
# headers the gate compiles against come from the pip wheel too). NVRTC only
# compiles (to PTX), so this needs no GPU and no driver.

name: Release

# Pull requests only: main receives the tested tree, nothing re-runs there.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The sealed payload is the same for every wheel: sealed once here (NVRTC-clean gate included), handed to
  # the wheel builds as an artifact.
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: aether
          fetch-depth: 0

      # The sibling eagle checkout `seal()` reads plugin/gref_layout.h and
      # plugin/gref_abi.h from (host path only; NVRTC itself is served an
      # alias). Pinned ref, else a same-named branch, else main.
      - uses: ./aether/.github/actions/companion
        with:
          repo: eagle
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: aether/.github/companions

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aether/dsc/pyproject.toml

      - run: python -m pip install --quiet "cuda-bindings" "nvidia-cuda-nvrtc-cu12" "nvidia-cuda-cccl-cu12" pyyaml

      - name: Seal this checkout's AETHER payload (NVRTC-clean gate included)
        run: cd aether/dsc && python -m aether_dsc.seal --layout-header "$GITHUB_WORKSPACE/eagle/plugin/gref_layout.h"

      - uses: actions/upload-artifact@v7
        with:
          name: payload
          retention-days: 7
          path: aether/dsc/aether_dsc/_payload/

  # One leg per platform. Every leg builds `aether._core` (plain C++, no CUDA); the x86_64 leg also builds the
  # two CUDA plugins (static cudart 12.9 and 13.0, compiled by g++, no nvcc). The CUDA 13 plugin is built
  # here and exercised by test-wheel, which is the CI row for it.
  wheels:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            plat: manylinux_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            plat: manylinux_aarch64
          - arch: macos-arm64
            runner: macos-14
            plat: macosx_arm64
    name: wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      # The same CIBW_BUILD lines as hawk's release.yml: every platform and Python hawk has a wheel for has an
      # aether-dsc wheel. A hawk matrix change lands here first.
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
      CIBW_BEFORE_BUILD: >-
        python -m pip install 'scikit-build-core>=0.10' 'setuptools-scm>=8' 'ninja>=1.5'
        'nanobind>=3.1,<4; python_version >= "3.10"'
        'nanobind>=2.2,<3; python_version < "3.10"'
      # The headers sit one directory above the package, outside cibuildwheel's copy: bind-mount the checkout.
      CIBW_CONTAINER_ENGINE: "docker; create_args: --volume ${{ github.workspace }}/aether:/sib/aether:ro"
      CIBW_ENVIRONMENT_LINUX: "AETHER_HEADER_ROOT=/sib/aether AETHER_CUDA12_ROOT=/usr/local/cuda-12.9 AETHER_CUDA13_ROOT=/usr/local/cuda-13.0 CMAKE_BUILD_PARALLEL_LEVEL=2"
      CIBW_ENVIRONMENT_MACOS: "AETHER_HEADER_ROOT=${{ github.workspace }}/aether"
      # Static cudart for both majors, x86_64 only (headers + libcudart_static.a, no compiler)
      CIBW_BEFORE_ALL_LINUX: >-
        git config --global --add safe.directory '*';
        if [ "$(uname -m)" = x86_64 ]; then
        curl -fsSL -o /etc/yum.repos.d/cuda-rhel8.repo
        https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
        dnf install -y --setopt=install_weak_deps=False cuda-cudart-devel-12-9 cuda-crt-12-9 cuda-cudart-devel-13-0 cuda-crt-13-0; fi
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"
      CIBW_TEST_SKIP: "*"
    steps:
      - uses: actions/checkout@v7
        with:
          path: aether
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: payload
          path: aether/dsc/aether_dsc/_payload

      # package-dir is aether/dsc, below the git root: the version is computed here and handed in
      - name: The version this checkout's label gives
        working-directory: aether
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          v=$(python tools/next_version.py "$PR_LABELS" 2>/dev/null || true)
          [ -n "$v" ] || v="0.0.0.dev0+g$(git rev-parse --short HEAD)"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$v" >> "$GITHUB_ENV"
          echo "CIBW_ENVIRONMENT_PASS_LINUX=SETUPTOOLS_SCM_PRETEND_VERSION" >> "$GITHUB_ENV"

      - name: Build wheels (cibuildwheel 3.x; CPython 3.9-3.14 plus free-threaded 3.13t/3.14t)
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: aether/dsc
          output-dir: dist
        env:
          CIBW_ENABLE: cpython-freethreading
          CIBW_BUILD: "cp39-${{ matrix.plat }} cp310-${{ matrix.plat }} cp311-${{ matrix.plat }} cp312-${{ matrix.plat }} cp313-${{ matrix.plat }} cp314-${{ matrix.plat }} cp313t-${{ matrix.plat }} cp314t-${{ matrix.plat }}"
      - name: Build the CPython 3.15 and 3.15t wheels (cibuildwheel 4.x)
        uses: pypa/cibuildwheel@v4.3.3
        with:
          package-dir: aether/dsc
          output-dir: dist
        env:
          CIBW_ENABLE: ""
          CIBW_BUILD: "cp315-${{ matrix.plat }} cp315t-${{ matrix.plat }}"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.arch }}
          retention-days: 7
          path: dist/

  # Assembles the wheels and the sdist into the one artifact the rest of the workflow and publish.yml use.
  build:
    needs: [seal, wheels]
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: aether
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aether/dsc/pyproject.toml

      - name: Tag this checkout with the version its label gives
        working-directory: aether
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          v=$(python tools/next_version.py "$PR_LABELS" 2>/dev/null || true)  # no label or release:none: build untagged (the gate reports a missing label)
          [ -z "$v" ] || git tag "v$v"

      - run: python -m pip install --quiet build "scikit-build-core>=0.10" "setuptools-scm>=8" "twine>=6" pyyaml

      - name: publish and deploy workflows only download, verify and upload
        run: python aether/tools/ci_publish_subset.py

      - uses: actions/download-artifact@v8
        with:
          name: payload
          path: aether/dsc/aether_dsc/_payload

      # the sealed blob ships inside the sdist; the sdist hook copies the header closure `_core` needs
      - name: Build the sdist
        run: cd aether/dsc && python -m build --sdist --outdir ../../dist

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Ten wheels per platform (3.9-3.15 plus 3.13t, 3.14t, 3.15t), none unrepaired
        run: |
          for plat in manylinux*_x86_64 manylinux*_aarch64 macosx_*_arm64; do
            n=$(find dist -name "*-${plat}.whl" | wc -l)
            [ "$n" -eq 10 ] || { echo "::error::$n wheels for $plat, expected 10"; exit 1; }
          done
          [ "$(find dist -name '*.whl' | wc -l)" -eq 30 ] || { echo "::error::unexpected wheel in dist"; ls dist; exit 1; }
          echo "OK: 10 wheels each for x86_64, aarch64 and macOS arm64"

      - name: Same CIBW_BUILD lines as hawk's release workflow
        run: |
          # the companion check lives in the hawk repo's own CI; here the lines must stay what the header says
          grep -c 'CIBW_BUILD: "cp39-' aether/.github/workflows/release.yml

      - name: Wheel contents - zero Requires-Dist, plugins on x86_64 only, only the seam exported
        run: |
          python - <<'PY'
          import glob, zipfile, subprocess, tempfile, os, re
          for whl in sorted(glob.glob("dist/*.whl")):
              z = zipfile.ZipFile(whl)
              names = z.namelist()
              meta = next(n for n in names if n.endswith(".dist-info/METADATA"))
              assert not [l for l in z.read(meta).decode().splitlines() if l.startswith("Requires-Dist") and "extra ==" not in l], whl
              plugins = sorted(os.path.basename(n) for n in names if re.search(r"aether/libaether_cuda\d+\.so$", n))
              want = ["libaether_cuda12.so", "libaether_cuda13.so"] if "x86_64" in whl and "manylinux" in whl else []
              assert plugins == want, (whl, plugins)
              assert not any("libcudart" in n or "libcuda." in n for n in names), whl
              assert not any(n.startswith("aether/") and n.endswith(".py") and re.search(r"^\s*(import|from)\s+numpy\b", z.read(n).decode(), re.M) for n in names), whl
              if want and "cp312-cp312-" in whl:
                  with tempfile.TemporaryDirectory() as d:
                      for p in plugins:
                          open(f"{d}/{p}", "wb").write(z.read(f"aether/{p}"))
                          out = subprocess.run(["nm", "-D", "--defined-only", f"{d}/{p}"], capture_output=True, text=True, check=True).stdout
                          syms = {l.split()[-1].split("@")[0] for l in out.splitlines() if l.strip()}
                          assert syms == {"aether_memory_v1"}, (p, syms)
          print("OK")
          PY

      - run: python -m twine check --strict dist/*

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - id: tree
        run: echo "tree=$(git -C aether rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.tree.outputs.tree }}
          retention-days: 90
          path: dist/

  test-wheel:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.13t"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.tree }}
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fresh venv, install the wheel (no dependencies at all), pip check, tests
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --quiet --no-index --find-links "$GITHUB_WORKSPACE/dist" aether-dsc
          pip check
          pip install --quiet pytest
          python - <<'PY'
          import aether_dsc, aether
          p = aether_dsc.payload()
          assert p.headers and p.digest
          a = aether.zeros((2, 3), "float32")
          assert a.shape == (2, 3) and memoryview(a).nbytes == 24
          # no GPU on this runner: both plugins load, their cudart answers "no device" or "driver too old",
          # and the error names both
          try:
              aether.empty(8, device="cuda")
          except aether.CudaUnavailable as exc:
              assert "cuda13" in str(exc) and "cuda12" in str(exc), exc
          print("OK")
          PY
          # the CUDA 13 plugin is its own check: it must load and answer
          AETHER_CUDA_MAJOR=13 python - <<'PY'
          import aether
          try:
              aether.empty(8, device="cuda")
          except aether.CudaUnavailable as exc:
              assert "cuda13 runtime" in str(exc), exc
              print("OK: the CUDA 13 plugin loaded and reported:", exc)
          PY
          # the payload does not depend on the arrays
          rm venv/lib/python*/site-packages/aether/_core*.so
          python -c "import aether_dsc; aether_dsc.payload()"
          python -c "import aether" 2>&1 | grep -q "_core is not built" 
          pip install --quiet --no-index --find-links "$GITHUB_WORKSPACE/dist" --force-reinstall aether-dsc
          cd "$GITHUB_WORKSPACE/dsc/tests"
          python -m pytest -q -c /dev/null --rootdir . test_arrays.py test_ft_payload.py -p no:cacheprovider
        # outside the checkout: from dsc/ the source folder dsc/aether (no _core) would shadow the installed wheel
        working-directory: ${{ runner.temp }}

  # the sdist builds `_core` from source on a machine with a C++ compiler and no CUDA toolkit
  sdist-install:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.tree }}
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The sdist installs into a clean venv, imports, makes host arrays, refuses device ones by name
        run: |
          python -m venv sv
          sv/bin/python -m pip install --quiet dist/*.tar.gz
          sv/bin/python -m pip check
          want=$(basename dist/*.tar.gz .tar.gz); want=${want##*-}
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/sv/bin/python" - <<PY
          import aether_dsc, aether
          p = aether_dsc.payload()
          assert p.headers and p.digest
          assert aether_dsc.__version__ == "$want", aether_dsc.__version__
          assert aether.zeros(4).nbytes == 32
          try:
              aether.empty(4, device="cuda")
          except aether.CudaUnavailable:
              print("OK")
          PY

  # Notebooks are executed locally (`make -C docs nbexec`) and committed with
  # outputs; nbcheck only verifies they have them (conf.py sets
  # `nb_execution_mode = "off"`).
  docs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: manifesto copy matches raptor
        run: bash tools/manifesto_check.sh CONTRIBUTING.md

      - run: sudo apt-get update && sudo apt-get install -y doxygen

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Tag this checkout with the version its label gives
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          v=$(python tools/next_version.py "$PR_LABELS" 2>/dev/null || true)  # no label or release:none: build untagged (the gate reports a missing label)
          [ -z "$v" ] || git tag "v$v"

      # companion site (amasat01.github.io): the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./.github/actions/companion
        with:
          repo: amasat01.github.io
          path: site
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: .github/companions

      - run: python3 -m pip install -r docs/requirements.txt
      # the checked-out site replaces the package the requirements fetch, so a PR pair is what is tested
      - run: python3 -m pip install ./site

      # The generated capability map matches the site's data.
      - run: python3 -m raptor_docs.fresh --check

      # Refuses to proceed unless every tutorial/example notebook cell
      # already ran clean.
      - run: make -C docs nbcheck

      # doxygen (breathe's XML source) + sphinx -W --keep-going: 0 warnings.
      - run: make -C docs strict
      - name: every public name has a page
        # aether_dsc from the source tree, as docs/conf.py reads it
        run: PYTHONPATH=dsc python tools/docs_inventory_check.py docs/_build/html/objects.inv aether_dsc --allow seal

      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ needs.build.outputs.tree }}
          retention-days: 90
          path: docs/_build/html

  # Proves the C++ in every notebook: re-runs each one on the CPU and diffs
  # the outputs, and compiles every snippet with nvcc (compile-only, no GPU).
  nbverify:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v7

      # g++-13 is the compiler ci.yml uses; the harness invokes `g++`, so
      # point that name at it.
      - run: |
          sudo apt-get update
          sudo apt-get install -y g++-13
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      # nvcc for compile-only checks of the CUDA arm: NVIDIA's apt repo,
      # just the compiler, the runtime headers and CCCL (no driver, no GPU).
      - run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-nvcc-12-6 cuda-cudart-dev-12-6 cuda-cccl-12-6
          echo /usr/local/cuda-12.6/bin >> "$GITHUB_PATH"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - uses: ./.github/actions/companion
        with:
          repo: amasat01.github.io
          path: site
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: .github/companions

      - run: python3 -m pip install -r docs/requirements.txt
      - run: python3 -m pip install ./site

      - run: nvcc --version && g++ --version

      # --require-cuda: a missing nvcc is a failure here, never a skip.
      - run: make -C docs nbverify NBVERIFY_ARGS=--require-cuda

  # Informational: a docs-only PR carries an already published version.
  pypi-version:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.tree }}
          path: dist
      - run: |
          whl=$(basename "$(ls dist/*.whl | head -1)")   # 30 wheels, one version
          version=$(echo "$whl" | cut -d- -f2)
          if curl -fsS "https://pypi.org/pypi/aether-dsc/${version}/json" > /dev/null; then
            echo "::notice::aether-dsc ${version} is already on PyPI; a release needs a version bump"
          else
            echo "::notice::aether-dsc ${version} is not on PyPI yet"
          fi
