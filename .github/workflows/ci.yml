#
# CPU-only CI: the C++ (CPP_MODE) arms, debug and release. The CUDA arms
# need an actual GPU runner and a CUDA toolchain; GitHub-hosted `ubuntu-latest`
# has neither, so they are NOT wired here. They belong on a self-hosted GPU
# runner when one exists.

name: CI

# Pull requests only: main receives the tested tree, nothing re-runs there.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    # The release label, the diff, the PR body and the tag it would create agree (tools/release_gate.sh). Skipped on other PRs.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash tools/release_gate.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
  test-cpp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debug_mode: ["ON", "OFF"]
    env:
      CC: gcc-13
      CXX: g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version comes from the git tag (cmake/GitVersion.cmake)

      # C++23 (aether's cxx_std_23 requirement): ubuntu-latest (24.04) carries
      # gcc-13 as its default toolchain major; installed explicitly so the
      # compiler version is pinned rather than whatever "latest" resolves to.
      # OpenMP (find_package(OpenMP REQUIRED)) ships with g++, no extra package.
      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      # gates the committed C reference-core corpus header against the generator (aether_dsc.c_core)
      - run: PYTHONPATH=dsc python3 tools/c_core/mint_golden.py --check

      # gates that same header as strict C99 (compiled with $CC)
      - run: tests/c_core/check_c99.sh

      # pyflakes rules over every .py (ruleset in ruff.toml)
      - run: |
          python3 -m pip install --user --only-binary=:all: ruff==0.15.18
          python3 -m ruff check

      # pins the generator on shapes beyond the corpus (only test_c_core.py: the sibling dsc tests need the sealed payload and raptor)
      - run: python3 -m pip install --user pytest && PYTHONPATH=dsc python3 -m pytest dsc/tests/test_c_core.py -q

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-test-cpp-${{ matrix.debug_mode }}-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-test-cpp-${{ matrix.debug_mode }}-
      - run: ccache -z

      # Same variables the Makefile's cpp arm configures with
      # (AETHER_CPP_MODE=ON), plus AETHER_WARN_AS_ERR=ON.
      - run: |
          cmake -B build \
            -DFETCHCONTENT_QUIET=ON \
            -DAETHER_BUILD_TESTS=ON \
            -DAETHER_WARN_AS_ERR=ON \
            -DAETHER_DEBUG_MODE=${{ matrix.debug_mode }} \
            -DAETHER_CPP_MODE=ON .

      - run: cmake --build build -j"$(nproc)"

      # Never the binary bare — check_gate.sh is the suite-integrity gate
      # (manifest-backed, not a vacuous pass/fail count). Same command the
      # Makefile's `test` target runs.
      - run: tests/check_gate.sh cpp build/tests/aether_tests
      - if: always()
        run: ccache -s

  # Sanitizer leg (host only): the CPP_MODE suite built with -fsanitize=address,undefined and run
  # through the manifest gate. Three checks keep it from going vacuously green: the runtime is
  # linked, the committed canary (tests/sanitize/canary.cpp) trips every mode, and the suite
  # count equals the manifest. CUDA-side coverage is the local `sanitize-gate`
  # (tests/sanitize/README.md).
  sanitize-cpp:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version comes from the git tag (cmake/GitVersion.cmake)

      # A pass is remembered under a digest of every input this job reads: the tree, this workflow and the toolchain. On a hit
      # the job succeeds without building.
      - id: memo
        run: |
          digest=$(.github/ci_digest.sh --tree . --skip docs/ --skip .github/ --tag . --file .github/workflows/ci.yml --str "${ImageVersion:-}" --str "$(g++-13 --version 2>/dev/null | head -1 || true)") || exit 1
          [ -n "$digest" ] || { echo "::error::empty digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: pass
        uses: actions/cache/restore@v6
        with:
          path: ci-pass
          key: ci-pass-v2-sanitize-cpp-${{ steps.memo.outputs.digest }}
          lookup-only: true
      - id: plan
        env:
          HIT: ${{ steps.pass.outputs.cache-hit }}
          DIGEST: ${{ steps.memo.outputs.digest }}
        run: |
          if [ "$HIT" = true ]; then
            echo "sanitize-cpp: passed earlier on digest $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache
        if: steps.plan.outputs.run == 'true'

      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-sanitize-cpp-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-sanitize-cpp-
        if: steps.plan.outputs.run == 'true'
      - run: ccache -z
        if: steps.plan.outputs.run == 'true'

      - run: |
          cmake -B build \
            -DFETCHCONTENT_QUIET=ON \
            -DAETHER_BUILD_TESTS=ON \
            -DAETHER_DEBUG_MODE=ON \
            -DAETHER_CPP_MODE=ON \
            -DAETHER_SANITIZERS=address,undefined .
        if: steps.plan.outputs.run == 'true'
      - run: cmake --build build -j"$(nproc)"
        if: steps.plan.outputs.run == 'true'

      # Non-vacuity (i): the binary must actually carry the ASan runtime.
      - name: sanitizer runtime is linked
        run: |
          cd .
          { nm -D build/tests/aether_tests; nm build/tests/aether_tests; } 2>/dev/null | grep -q __asan_init \
            || { echo "RED: aether_tests carries no __asan_init — this job is not sanitizing"; exit 1; }
        if: steps.plan.outputs.run == 'true'

      # Non-vacuity (ii): each canary mode must exit non-zero AND print its banner.
      - name: canaries trip
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cd .
          fail=0
          for pair in "heap-oob:AddressSanitizer: heap-buffer-overflow" \
                      "leak:LeakSanitizer: detected memory leaks" \
                      "uninit:runtime error: load of value" \
                      "shift-ub:runtime error: shift exponent"; do
            mode="${pair%%:*}"; banner="${pair#*:}"
            set +e; build/tests/aether_canary "$mode" > canary.out 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ] || ! grep -q "$banner" canary.out; then
              echo "RED: canary '$mode' rc=$rc, banner '$banner' present: $(grep -c "$banner" canary.out)"; cat canary.out; fail=1
            else
              echo "canary '$mode' tripped (rc=$rc)"
            fi
          done
          exit $fail
        if: steps.plan.outputs.run == 'true'

      # Non-vacuity (iii): the manifest gate, with the sanitizer environment.
      - name: suite under check_gate
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cd .
          LSAN_OPTIONS="suppressions=$PWD/tests/sanitize/lsan.supp" tests/check_gate.sh cpp build/tests/aether_tests --config debug
        if: steps.plan.outputs.run == 'true'
      - if: always() && steps.plan.outputs.run == 'true'
        run: ccache -s
      - if: steps.plan.outputs.run == 'true'
        run: mkdir -p ci-pass && touch ci-pass/sanitize-cpp
      - if: hashFiles('ci-pass/*') != ''
        uses: actions/cache/save@v6
        with:
          path: ci-pass
          key: ci-pass-v2-sanitize-cpp-${{ steps.memo.outputs.digest }}

  # AETHER_HOST_VECTOR_MATH on three GCC majors from the distribution's own
  # packages: the reproducer and the vectorisation check under the default
  # macro rule, plus (13 and 14) a necessity step proving the rule is not
  # vacuous: with masked variants forced on, the compiler must miscompile the
  # conditional-call loop. The step passes only if the mismatch is reported.
  # The arrays binding and its CUDA 12 plugin built with clang (the wheels use gcc): a source build with clang and a
  # CUDA toolkit must work, and the plugin must export only the seam.
  clang-plugins:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-clang-plugins-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-clang-plugins-
      - name: clang, ninja and nvcc 12.6 with the runtime headers (no driver, no GPU)
        run: |
          curl -fsSL -o /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ccache ninja-build cuda-nvcc-12-6 cuda-cudart-dev-12-6
          python3 -m pip install --user "nanobind>=3.1,<4"
      - run: ccache -z
      - name: build _core and the plugin with clang, zero warnings
        env:
          CC: clang
          CXX: clang++
          AETHER_CUDA_ROOT: /usr/local/cuda-12.6
        run: |
          cmake -S dsc -B build-clang -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -Dnanobind_DIR="$(python3 -c 'import nanobind; print(nanobind.cmake_dir())')" -DPython_EXECUTABLE="$(command -v python3)"
          cmake --build build-clang
          syms=$(nm -D --defined-only build-clang/libaether_cuda.so | awk '{print $NF}')
          [ "$syms" = aether_memory_v1 ] || { echo "::error::the plugin exports more than the seam: $syms"; exit 1; }
      - if: always()
        run: ccache -s

  host-gcc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gcc: [12, 13, 14]
    name: host-gcc (${{ matrix.gcc }})
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.gcc }}
      - name: reproducer and vectorisation check (default macro)
        run: tests/packetmath/check_hvm_masked.sh g++-${{ matrix.gcc }}
      - name: necessity (masked variants forced on must miscompile)
        if: matrix.gcc != 12
        run: tests/packetmath/check_hvm_masked.sh g++-${{ matrix.gcc }} --necessity
      - name: nested select reads no stale stack (leaves held by reference)
        run: tests/hosttu/check_select_pta.sh g++-${{ matrix.gcc }}
      # Not yet known which of 12/13/14 carry the bug on this reduction (11.5 does);
      # once a run shows which are RED, gate this step on those majors only.
      - name: necessity (old by-value alias must miscompile)
        continue-on-error: true
        run: tests/hosttu/check_select_pta.sh g++-${{ matrix.gcc }} --necessity
