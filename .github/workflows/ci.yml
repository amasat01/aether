#
# CPU-only CI: the C++ (CPP_MODE) arms, debug and release. The CUDA arms
# need an actual GPU runner and a CUDA toolchain; GitHub-hosted `ubuntu-latest`
# has neither, so they are NOT wired here. They belong on a self-hosted GPU
# runner when one exists.

name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cpp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debug_mode: ["ON", "OFF"]
    env:
      CC: gcc-13
      CXX: g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7

      # C++23 (aether's cxx_std_23 requirement): ubuntu-latest (24.04) carries
      # gcc-13 as its default toolchain major; installed explicitly so the
      # compiler version is pinned rather than whatever "latest" resolves to.
      # OpenMP (find_package(OpenMP REQUIRED)) ships with g++, no extra package.
      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-test-cpp-${{ matrix.debug_mode }}-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-test-cpp-${{ matrix.debug_mode }}-
      - run: ccache -z

      # Same variables the Makefile's cpp arm configures with
      # (AETHER_CPP_MODE=ON), plus AETHER_WARN_AS_ERR=ON.
      - run: |
          cmake -B build \
            -DFETCHCONTENT_QUIET=ON \
            -DAETHER_BUILD_TESTS=ON \
            -DAETHER_WARN_AS_ERR=ON \
            -DAETHER_DEBUG_MODE=${{ matrix.debug_mode }} \
            -DAETHER_CPP_MODE=ON .

      - run: cmake --build build -j"$(nproc)"

      # Never the binary bare — check_gate.sh is the suite-integrity gate
      # (manifest-backed, not a vacuous pass/fail count). Same command the
      # Makefile's `test` target runs.
      - run: tests/check_gate.sh cpp build/tests/aether_tests
      - if: always()
        run: ccache -s

  # Sanitizer leg (host only): the CPP_MODE suite built with -fsanitize=address,undefined and run
  # through the manifest gate. Three checks keep it from going vacuously green: the runtime is
  # linked, the committed canary (tests/sanitize/canary.cpp) trips every mode, and the suite
  # count equals the manifest. CUDA-side coverage is the local `sanitize-gate`
  # (tests/sanitize/README.md).
  sanitize-cpp:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-sanitize-cpp-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-sanitize-cpp-
      - run: ccache -z

      - run: |
          cmake -B build \
            -DFETCHCONTENT_QUIET=ON \
            -DAETHER_BUILD_TESTS=ON \
            -DAETHER_DEBUG_MODE=ON \
            -DAETHER_CPP_MODE=ON \
            -DAETHER_SANITIZERS=address,undefined .
      - run: cmake --build build -j"$(nproc)"

      # Non-vacuity (i): the binary must actually carry the ASan runtime.
      - name: sanitizer runtime is linked
        run: |
          cd .
          { nm -D build/tests/aether_tests; nm build/tests/aether_tests; } 2>/dev/null | grep -q __asan_init \
            || { echo "RED: aether_tests carries no __asan_init — this job is not sanitizing"; exit 1; }

      # Non-vacuity (ii): each canary mode must exit non-zero AND print its banner.
      - name: canaries trip
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cd .
          fail=0
          for pair in "heap-oob:AddressSanitizer: heap-buffer-overflow" \
                      "leak:LeakSanitizer: detected memory leaks" \
                      "uninit:runtime error: load of value" \
                      "shift-ub:runtime error: shift exponent"; do
            mode="${pair%%:*}"; banner="${pair#*:}"
            set +e; build/tests/aether_canary "$mode" > canary.out 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ] || ! grep -q "$banner" canary.out; then
              echo "RED: canary '$mode' rc=$rc, banner '$banner' present: $(grep -c "$banner" canary.out)"; cat canary.out; fail=1
            else
              echo "canary '$mode' tripped (rc=$rc)"
            fi
          done
          exit $fail

      # Non-vacuity (iii): the manifest gate, with the sanitizer environment.
      - name: suite under check_gate
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cd .
          LSAN_OPTIONS="suppressions=$PWD/tests/sanitize/lsan.supp" tests/check_gate.sh cpp build/tests/aether_tests --config debug
      - if: always()
        run: ccache -s
