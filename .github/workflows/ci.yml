#
# CPU-only CI: the C++ (CPP_MODE) arms, debug and release. The CUDA arms
# need an actual GPU runner and a CUDA toolchain; GitHub-hosted `ubuntu-24.04`
# has neither, so they are NOT wired here. They belong on a self-hosted GPU
# runner when one exists.

name: CI

# Pull requests only: main receives the tested tree, nothing re-runs there.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    # The release label, the diff, the PR body and the tag it would create agree (tools/release_gate.sh). Skipped on other PRs.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash tools/release_gate.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
  test-cpp:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        debug_mode: ["ON", "OFF"]
    env:
      CC: gcc-13
      CXX: g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version comes from the git tag (cmake/GitVersion.cmake)

      # C++23 (aether's cxx_std_23 requirement): ubuntu-24.04 carries
      # gcc-13 as its default toolchain major; installed explicitly so the
      # compiler version is pinned rather than whatever "latest" resolves to.
      # OpenMP (find_package(OpenMP REQUIRED)) ships with g++, no extra package.
      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      # ruff, the committed C reference-core corpus (generator check, strict C99), the generator's tests
      - run: make gate-lint
      # the public-name check is raptor's (raptor.conformance.public_names): this branch's raptor, else main
      - uses: ./.github/actions/companion
        with:
          repo: raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: .github/companions
      - run: make gate-names RAPTOR_SRC=raptor

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-test-cpp-${{ matrix.debug_mode }}-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-test-cpp-${{ matrix.debug_mode }}-
      - run: ccache -z

      # warnings as errors, then the manifest gate (check_gate.sh, never the binary bare)
      - run: make gate-cpp gate_debug=${{ matrix.debug_mode }} GATE_JOBS=$(nproc)
      - if: always()
        run: ccache -s

  # Sanitizer leg (host only): the CPP_MODE suite built with -fsanitize=address,undefined and run
  # through the manifest gate. Three checks keep it from going vacuously green: the runtime is
  # linked, the committed canary (tests/sanitize/canary.cpp) trips every mode, and the suite
  # count equals the manifest. CUDA-side coverage is the local `sanitize-gate`
  # (tests/sanitize/README.md).
  sanitize-cpp:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version comes from the git tag (cmake/GitVersion.cmake)

      # A pass is remembered under a digest of every input this job reads: the tree, this workflow and the toolchain. On a hit
      # the job succeeds without building.
      - id: memo
        run: |
          digest=$(.github/ci_digest.sh --tree . --skip docs/ --skip .github/ --tag . --file .github/workflows/ci.yml --str "${ImageVersion:-}" --str "$(g++-13 --version 2>/dev/null | head -1 || true)") || exit 1
          [ -n "$digest" ] || { echo "::error::empty digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: pass
        uses: actions/cache/restore@v6
        with:
          path: ci-pass
          key: ci-pass-v2-sanitize-cpp-${{ steps.memo.outputs.digest }}
          lookup-only: true
      - id: plan
        env:
          HIT: ${{ steps.pass.outputs.cache-hit }}
          DIGEST: ${{ steps.memo.outputs.digest }}
        run: |
          if [ "$HIT" = true ]; then
            echo "sanitize-cpp: passed earlier on digest $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache
        if: steps.plan.outputs.run == 'true'

      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-sanitize-cpp-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-sanitize-cpp-
        if: steps.plan.outputs.run == 'true'
      - run: ccache -z
        if: steps.plan.outputs.run == 'true'

      # build with ASan/UBSan, then the runtime-linked, canary and manifest checks (tests/sanitize/cpp_gate.sh)
      - run: make gate-sanitize GATE_JOBS=$(nproc)
        if: steps.plan.outputs.run == 'true'
      - if: always() && steps.plan.outputs.run == 'true'
        run: ccache -s
      - if: steps.plan.outputs.run == 'true'
        run: mkdir -p ci-pass && touch ci-pass/sanitize-cpp
      - if: hashFiles('ci-pass/*') != ''
        uses: actions/cache/save@v6
        with:
          path: ci-pass
          key: ci-pass-v2-sanitize-cpp-${{ steps.memo.outputs.digest }}

  # AETHER_HOST_VECTOR_MATH on three GCC majors from the distribution's own
  # packages: the reproducer and the vectorisation check under the default
  # macro rule, plus (13 and 14) a necessity step proving the rule is not
  # vacuous: with masked variants forced on, the compiler must miscompile the
  # conditional-call loop. The step passes only if the mismatch is reported.
  # The arrays binding and its CUDA 12 plugin built with clang (the wheels use gcc): a source build with clang and a
  # CUDA toolkit must work, and the plugin must export only the seam.
  clang-plugins:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-clang-plugins-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-clang-plugins-
      - name: clang and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libomp-dev ccache ninja-build
          python3 -m pip install --user "nanobind>=3.1,<4"
      - uses: ./.github/actions/cuda
      - run: ccache -z
      - name: build _core and the plugin with clang, zero warnings
        run: make gate-clang CUDA_PATH=/usr/local/cuda-12.9
      - if: always()
        run: ccache -s

  host-gcc:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc: [12, 13, 14]
    name: host-gcc (${{ matrix.gcc }})
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.gcc }}
      # the necessity step proves this compiler carries the bug the rule works around: Ubuntu's g++-13 and g++-14 do
      - name: reproducers, vectorisation check and nested select
        run: make gate-hostgcc CC=gcc-${{ matrix.gcc }} CXX=g++-${{ matrix.gcc }} ${{ matrix.gcc != 12 && 'GATE_NECESSITY=1' || '' }}
