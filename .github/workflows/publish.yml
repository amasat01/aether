#
# Publish aether-dsc to PyPI through a Trusted Publisher (PyPI pending
# publisher: owner amasat01, GitHub environment "pypi"). No tokens, no
# secrets: the `publish` job authenticates with the environment's OIDC
# token (`permissions: id-token: write`).
#
# Nothing is built here. release.yml sealed, built, checked and tested the
# wheel on the pull request and stored it under the git tree hash; this
# workflow fetches that artifact for the tagged tree, verifies its checksums
# and uploads it. Pushing a tag `v*` publishes. `workflow_dispatch` runs the
# same fetch and verification but never uploads (a dry run).
#
# Release order across the family: raptor-core and aether-dsc publish FIRST
# (hawk depends on aether-dsc) — see CONTRIBUTING.md "Releasing".

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the artifact built for this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci_fetch_artifact.sh dist "$(git rev-parse 'HEAD^{tree}')" dist
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: tag == version guard
        if: github.ref_type == 'tag'
        run: |
          version=$(basename dist/*.whl | cut -d- -f2)
          test "${GITHUB_REF_NAME}" = "v${version}" \
            || { echo "::error::tag ${GITHUB_REF_NAME} != package version v${version}"; exit 1; }
          echo "OK: tag ${GITHUB_REF_NAME} == package version ${version}"
      - run: rm dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: aether-dsc-dist
          retention-days: 7
          path: dist/

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aether-dsc
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aether-dsc-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
