[build-system]
requires = [
    "scikit-build-core>=0.10",
    "setuptools-scm>=8",
    # nanobind 3 needs Python 3.10+; 3.9 (no free-threaded build) uses nanobind 2
    "nanobind>=3.1,<4; python_version>='3.10'",
    "nanobind>=2.2,<3; python_version<'3.10'",
]
build-backend = "_build_backend"
backend-path = ["."]

[project]
# DIST name vs IMPORT name (mirrors raptor's "raptor-core" / hawk's
# "raptor-hawk"). The import name stays flat
# (`import aether_dsc`).
name = "aether-dsc"
# aether-dsc ships a SEALED payload of its own checkout and takes aether's version
# from the same git tag (setuptools-scm, root = ".."), so the two cannot skew.
dynamic = ["version"]
description = "aether-dsc: the sealed AETHER header payload (aether_dsc) and CPU/GPU arrays for Python (aether)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Alessandro Masat" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
# Zero runtime dependencies: the sealed payload unpacks with the standard library, and the arrays
# (`aether`) need neither numpy nor cuda-bindings. `seal()`'s own NVRTC-clean gate needs cuda-bindings, but
# only when actually SEALING (`python -m aether_dsc.seal`, a dev-time operation).
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/amasat01/aether"
Documentation = "https://amasat01.github.io/aether/"
Repository = "https://github.com/amasat01/aether"

[tool.setuptools_scm]
root = ".."

# One wheel per platform and Python: `aether_dsc/` (the sealed payload, data) and `aether/` (the arrays,
# `aether._core` plus, on linux x86_64, the two CUDA plugins). The extension is plain C++; no nvcc.
[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["aether_dsc"]   # `aether/` (python files, _core, plugins) is installed by CMakeLists.txt
wheel.exclude = ["**/__pycache__/**"]
cmake.version = ">=3.20"
# The sealed blob is git-ignored dev-time output but must ship, and so must the header copy.
sdist.exclude = ["**/*.so", "build", "**/__pycache__", "*.egg-info"]
sdist.include = ["aether_dsc/_payload/**", "_sdist_include/**"]
wheel.license-files = ["LICENSE", "NOTICE"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ft: free-threading rows (raptor.conformance.freethreading) -- skip on a GIL build; select with -m ft on 3.13t/3.14t.",
]
# Makes `import aether_dsc` work against the checked-out tree without an
# install — this repo root, prepended to sys.path before collection (mirrors
# raptor's/hawk's own pyproject convention).
pythonpath = ["."]
